services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: two_tdb
      TWO_TDB_APP_PASSWORD: ${TWO_TDB_APP_PASSWORD:-two_tdb_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql
      # run once, on an empty volume
      - ./src/two_tdb/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./deploy/app-login.sh:/docker-entrypoint-initdb.d/2-app-login.sh:ro
    healthcheck:
      # over TCP, which the image's init server doesn't listen on
      test: ["CMD", "pg_isready", "--host", "localhost", "--username", "postgres"]
      interval: 2s
      retries: 15

  app:
    build: .
    environment:
      TWO_TDB_DATABASE_URL: postgresql://two_tdb_app:${TWO_TDB_APP_PASSWORD:-two_tdb_app}@db/two_tdb
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
