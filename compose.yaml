services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: pg2tdb
      PY2TDB_APP_PASSWORD: ${PY2TDB_APP_PASSWORD:-pg2tdb_app}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db:/var/lib/postgresql
      # run once, on an empty volume
      - ./src/py2tdb/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./deploy/app-login.sh:/docker-entrypoint-initdb.d/2-app-login.sh:ro
    healthcheck:
      # over TCP, which the image's init server doesn't listen on
      test: ["CMD", "pg_isready", "--host", "localhost", "--username", "postgres"]
      interval: 2s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    environment:
      PY2TDB_DATABASE_URL: postgresql://pg2tdb_app:${PY2TDB_APP_PASSWORD:-pg2tdb_app}@db/pg2tdb
      PY2TDB_CORS_ORIGIN: ${PY2TDB_CORS_ORIGIN:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 2s
      retries: 15

  # HTTPS in front of the app, for a public server: set COMPOSE_PROFILES=public
  # and DOMAIN in .env
  caddy:
    image: caddy:2.11.9
    profiles: [public]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  db:
  caddy:
