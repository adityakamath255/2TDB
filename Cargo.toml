[package]
name = "time-travel-db-rs"
version = "0.1.0"
edition = "2024"
description = "An append-only, time-travelling key-value store: state folded from an event log, with cheap historical snapshots."
authors = ["Aditya Kamath <aditya.kamath.270@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["database", "time-travel", "event-sourcing", "key-value", "append-only"]
categories = ["database-implementations", "data-structures"]

[dependencies]
imbl = "7.0.0"
jiff = { version = "0.2.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
