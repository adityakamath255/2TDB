[project]
name = "two-tdb"
version = "0.1.0"
description = "A bitemporal key-value store on Postgres, served over HTTP to programs and LLM agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.13",
    "langchain-core>=1.8.5",
    "langgraph>=1.2.24",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anthropic>=2.14.0",
    "httpx2>=2.16.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning:langsmith"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# ruff's default rule set leaves out E501, and the formatter can't split
# strings or comments
extend-select = ["E501"]

[tool.pyright]
include = ["src", "tests", "evaluation"]
